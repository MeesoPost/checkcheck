[package]
name = "checkcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Report which running Docker containers have a real image update available"
license = "MIT"

[dependencies]
anyhow = "1"
bollard = "0.17"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
terminal_size = "0.4"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
